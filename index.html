<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Roblox Executors Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #030712;
            --glass: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 40px 15px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.3rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-sub);
            font-size: 1rem;
            margin: 0;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { color: var(--text-sub); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-WORKING { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-PATCHED { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-UNSTABLE { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-OUTDATED { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="mainTitle">Roblox Executors Status</h1>
            <p id="mainSubtitle">Đang tải trạng thái các Executor mới nhất...</p>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tên Executor</th>
                            <th>Nền tảng</th>
                            <th>Trạng thái</th>
                            <th>Giá</th>
                            <th>Cập nhật</th>
                            <th>Ghi chú</th>
                        </tr>
                    </thead>
                    <tbody id="publicTableBody">
                        <tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Đang đồng bộ dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://api.npoint.io/9d78b91f5a0f7c9f5ec8";

        async function fetchPublicData() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime());
                const data = await res.json();

                let itemsList = [];

                if (Array.isArray(data)) {
                    itemsList = data;
                } else if (data && typeof data === 'object') {
                    if (data.title) {
                        document.getElementById('mainTitle').textContent = data.title;
                        document.getElementById('pageTitle').textContent = data.title;
                    }
                    if (data.subtitle) {
                        document.getElementById('mainSubtitle').textContent = data.subtitle;
                    }
                    itemsList = Array.isArray(data.items) ? data.items : [];
                }

                renderTable(itemsList);
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu:", err);
                document.getElementById('publicTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ef4444;">Không thể kết nối máy chủ!</td></tr>`;
            }
        }

        function renderTable(items) {
            const tbody = document.getElementById('publicTableBody');

            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-sub);">Chưa có dữ liệu nào.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => `
                <tr>
                    <td style="font-weight: 600; color: #fff;">${item.name || ''}</td>
                    <td><span style="color: var(--text-sub);"><i class="fas fa-laptop-code"></i> ${item.plat || ''}</span></td>
                    <td><span class="badge status-${item.status}">${item.status}</span></td>
                    <td style="color: #a78bfa; font-weight: 500;">${item.price || 'Free'}</td>
                    <td style="color: var(--text-sub); font-size: 0.85rem;">${item.time || 'N/A'}</td>
                    <td style="color: var(--text-sub); font-size: 0.85rem;">${item.note || '-'}</td>
                </tr>
            `).join('');
        }

        fetchPublicData();
    </script>
</body>
</html>

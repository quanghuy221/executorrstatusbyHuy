<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Executors Status By Huy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(19, 27, 46, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1050px; margin: 0 auto; }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
            margin-bottom: 15px;
            transform: translate3d(0,0,0);
        }

        .header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 30%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.98rem;
            margin: 0 auto;
            max-width: 600px;
        }

        /* STATS BAR */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transform: translate3d(0,0,0);
        }

        .stat-info .title { font-size: 0.78rem; color: var(--text-sub); font-weight: 500; text-transform: uppercase; }
        .stat-info .num { font-size: 1.4rem; font-weight: 700; color: #fff; margin-top: 2px; }
        .stat-icon { font-size: 1.5rem; opacity: 0.8; }

        /* SEARCH & FILTER BAR */
        .controls-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .search-box input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .filter-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* MAIN CARD & TABLE */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 8px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 14px 16px; text-align: left; }
        
        th { 
            color: var(--text-sub); 
            font-size: 0.78rem; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background-color 0.15s ease, transform 0.15s ease;
            will-change: transform;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
            transform: translateY(-1px);
        }

        /* BADGES */
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            letter-spacing: 0.5px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        /* STATUS WORKING */
        .status-WORKING {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-WORKING .dot { background: #34d399; box-shadow: 0 0 8px #34d399; animation: pulseGlow 1.8s infinite; }

        /* STATUS PATCHED */
        .status-PATCHED {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status-PATCHED .dot { background: #f87171; box-shadow: 0 0 8px #f87171; }

        /* STATUS UNSTABLE */
        .status-UNSTABLE {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .status-UNSTABLE .dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation: pulseGlow 1.8s infinite; }

        /* STATUS OUTDATED */
        .status-OUTDATED {
            background: rgba(148, 163, 184, 0.12);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .status-OUTDATED .dot { background: #94a3b8; }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .platform-tag {
            color: #e2e8f0;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .price-tag {
            font-weight: 600;
            color: #c084fc;
            font-size: 0.88rem;
        }

        .price-free { color: #34d399; }

        .time-tag { color: var(--text-sub); font-size: 0.83rem; }
        .note-tag { color: var(--text-sub); font-size: 0.83rem; font-style: italic; }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-logo"><i class="fas fa-bolt"></i></div>
            <h1 id="mainTitle">Roblox Executors Status</h1>
            <p id="mainSubtitle">Đang đồng bộ trạng thái trực tiếp từ hệ thống...</p>
        </div>

        <!-- STATS BAR -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <div class="title">Tổng Executor</div>
                    <div class="num" id="statTotal">0</div>
                </div>
                <i class="fas fa-cubes stat-icon" style="color: #a78bfa;"></i>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <div class="title">Đang Hoạt Động</div>
                    <div class="num" id="statWorking" style="color: #34d399;">0</div>
                </div>
                <i class="fas fa-circle-check stat-icon" style="color: #34d399;"></i>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <div class="title">Bị Khóa / Đang Lỗi</div>
                    <div class="num" id="statPatched" style="color: #f87171;">0</div>
                </div>
                <i class="fas fa-triangle-exclamation stat-icon" style="color: #f87171;"></i>
            </div>
        </div>

        <!-- SEARCH & FILTERS -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm Executor theo tên..." oninput="filterData()">
            </div>
            <div class="filter-tabs">
                <button class="filter-btn active" onclick="setFilter('ALL', this)">Tất cả</button>
                <button class="filter-btn" onclick="setFilter('Windows', this)"><i class="fab fa-windows"></i> Windows</button>
                <button class="filter-btn" onclick="setFilter('Android', this)"><i class="fab fa-android"></i> Android</button>
                <button class="filter-btn" onclick="setFilter('iOS', this)"><i class="fab fa-apple"></i> iOS</button>
                <button class="filter-btn" onclick="setFilter('Mac', this)"><i class="fas fa-desktop"></i> Mac</button>
            </div>
        </div>

        <!-- DATA TABLE -->
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tên Executor</th>
                            <th>Nền tảng</th>
                            <th>Trạng thái</th>
                            <th>Giá</th>
                            <th>Cập nhật</th>
                            <th>Ghi chú</th>
                        </tr>
                    </thead>
                    <tbody id="publicTableBody">
                        <tr>
                            <td colspan="6" class="loading-state">
                                <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 8px; color: var(--accent);"></i>
                                <div>Đang kết nối dữ liệu...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://api.npoint.io/9d78b91f5a0f7c9f5ec8";
        let rawItemsList = [];
        let currentPlatform = 'ALL';

        function getPlatIcon(plat) {
            const p = (plat || '').toLowerCase();
            if (p.includes('win')) return '<i class="fab fa-windows" style="color:#38bdf8;"></i>';
            if (p.includes('android')) return '<i class="fab fa-android" style="color:#4ade80;"></i>';
            if (p.includes('ios')) return '<i class="fab fa-apple" style="color:#f43f5e;"></i>';
            if (p.includes('mac')) return '<i class="fas fa-desktop" style="color:#c084fc;"></i>';
            return '<i class="fas fa-terminal"></i>';
        }

        async function fetchPublicData() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime());
                const data = await res.json();

                if (Array.isArray(data)) {
                    rawItemsList = data;
                } else if (data && typeof data === 'object') {
                    if (data.title) {
                        document.getElementById('mainTitle').textContent = data.title;
                        document.getElementById('pageTitle').textContent = data.title;
                    }
                    if (data.subtitle) {
                        document.getElementById('mainSubtitle').textContent = data.subtitle;
                    }
                    rawItemsList = Array.isArray(data.items) ? data.items : [];
                }

                updateStats();
                filterData();
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu:", err);
                document.getElementById('publicTableBody').innerHTML = 
                    `<tr><td colspan="6" style="text-align:center; color: #f87171; padding:30px;"><i class="fas fa-wifi"></i> Không thể kết nối tới máy chủ!</td></tr>`;
            }
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = rawItemsList.length;
            
            const working = rawItemsList.filter(i => (i.status || '').toUpperCase() === 'WORKING').length;
            const patched = rawItemsList.filter(i => {
                const st = (i.status || '').toUpperCase();
                return st === 'PATCHED' || st === 'UNSTABLE' || st === 'OUTDATED';
            }).length;

            document.getElementById('statWorking').textContent = working;
            document.getElementById('statPatched').textContent = patched;
        }

        function setFilter(plat, btn) {
            currentPlatform = plat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterData();
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = rawItemsList.filter(item => {
                const matchesSearch = (item.name || '').toLowerCase().includes(query) || 
                                      (item.note || '').toLowerCase().includes(query);
                const matchesPlat = currentPlatform === 'ALL' || (item.plat || '').toLowerCase() === currentPlatform.toLowerCase();
                return matchesSearch && matchesPlat;
            });

            renderTable(filtered);
        }

        function renderTable(items) {
            const tbody = document.getElementById('publicTableBody');

            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-sub); padding:30px;">Không tìm thấy Executor phù hợp.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const statusUpper = (item.status || 'WORKING').toUpperCase();
                const priceClass = (item.price || '').toLowerCase() === 'free' ? 'price-free' : '';

                return `
                    <tr>
                        <td style="font-weight: 700; color: #fff; font-size:0.95rem;">${item.name || ''}</td>
                        <td><span class="platform-tag">${getPlatIcon(item.plat)} ${item.plat || ''}</span></td>
                        <td>
                            <span class="status-badge status-${statusUpper}">
                                <span class="dot"></span>
                                ${statusUpper}
                            </span>
                        </td>
                        <td><span class="price-tag ${priceClass}">${item.price || 'Free'}</span></td>
                        <td><span class="time-tag">${item.time || 'Vừa xong'}</span></td>
                        <td><span class="note-tag">${item.note || '-'}</span></td>
                    </tr>
                `;
            }).join('');
        }

        fetchPublicData();
    </script>
</body>
</html>

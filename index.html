<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Roblox Executors Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(19, 27, 46, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin: 0;
        }

        /* STATS BOARD */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .stat-info .title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-info .num {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .stat-icon {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        /* FILTER BAR */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        /* TABLE DESIGN */
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 650px;
        }

        th {
            padding: 16px 20px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .exec-name {
            font-weight: 700;
            color: #ffffff;
        }

        .plat-tag {
            color: #94a3b8;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* BADGES STATUS */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        /* 1. WORKING - XANH LÁ */
        .status-working {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-working .dot {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* 2. UNSTABLE - CAM */
        .status-unstable {
            background: rgba(249, 115, 22, 0.15);
            color: #f97316;
            border: 1px solid rgba(249, 115, 22, 0.35);
        }
        .status-unstable .dot {
            background: #f97316;
            box-shadow: 0 0 8px #f97316;
        }

        /* 3. PATCHED - ĐỎ TƯƠI NỀN TỐI */
        .status-patched {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status-patched .dot {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        /* 4. OUTDATED - CHỮ ĐỎ ĐẬM RÕ NÉT (KHÔNG BỊ MÀU TRẮNG) */
        .status-outdated {
            background: rgba(185, 28, 28, 0.22);
            color: #ff4d4d;
            border: 1px solid rgba(239, 68, 68, 0.45);
        }
        .status-outdated .dot {
            background: #ff4d4d;
            box-shadow: 0 0 8px #ff4d4d;
        }

        .price-text {
            font-weight: 600;
            color: #c084fc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-icon"><i class="fas fa-bolt"></i></div>
            <h1 id="mainTitle">Roblox Executors Status</h1>
            <p class="subtitle" id="mainSubtitle">Trạng thái cập nhật liên tục các Executor cho Windows, Android, iOS & Mac</p>
        </div>

        <!-- STATS BOARD -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <div class="title">TỔNG EXECUTOR</div>
                    <div class="num" id="totalCount">0</div>
                </div>
                <i class="fas fa-cubes stat-icon" style="color: #a78bfa;"></i>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <div class="title">ĐANG HOẠT ĐỘNG</div>
                    <div class="num" id="workingCount" style="color: #10b981;">0</div>
                </div>
                <i class="fas fa-check-circle stat-icon" style="color: #10b981;"></i>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <div class="title">BỊ KHÓA / ĐANG LỖI</div>
                    <div class="num" id="errorCount" style="color: #ef4444;">0</div>
                </div>
                <i class="fas fa-triangle-exclamation stat-icon" style="color: #ef4444;"></i>
            </div>
        </div>

        <!-- FILTER & SEARCH -->
        <div class="filter-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm Executor theo tên..." oninput="filterData()">
            </div>
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="setTab('all', this)">Tất cả</button>
                <button class="tab-btn" onclick="setTab('Windows', this)"><i class="fab fa-windows"></i> Windows</button>
                <button class="tab-btn" onclick="setTab('Android', this)"><i class="fab fa-android"></i> Android</button>
                <button class="tab-btn" onclick="setTab('iOS', this)"><i class="fab fa-apple"></i> iOS</button>
                <button class="tab-btn" onclick="setTab('Mac', this)"><i class="fas fa-desktop"></i> Mac</button>
            </div>
        </div>

        <!-- MAIN TABLE -->
        <div class="table-card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>TÊN EXECUTOR</th>
                            <th>NỀN TẢNG</th>
                            <th>TRẠNG THÁI</th>
                            <th>GIÁ</th>
                            <th>CẬP NHẬT</th>
                            <th>GHI CHÚ</th>
                        </tr>
                    </thead>
                    <tbody id="execTableBody">
                        <tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--text-sub);">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CHẶN MỞ DEVTOOLS & SOI CODE F12
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
                (e.ctrlKey && ['U', 'u', 'S', 's'].includes(e.key))
            ) {
                e.preventDefault();
                return false;
            }
        });

        setInterval(() => {
            const startTime = performance.now();
            debugger;
            const endTime = performance.now();
            if (endTime - startTime > 100) {
                document.body.innerHTML = '<div style="color:#ef4444;text-align:center;padding:100px;font-weight:bold;font-size:24px;">CẢNH BÁO: HÀNH VI SOI CODE BỊ CẤM!</div>';
            }
        }, 300);

        // DỮ LIỆU VÀ HIỂN THỊ
        const API_URL = "https://api.npoint.io/9d78b91f5a0f7c9f5ec8";
        let rawItemsList = [];
        let currentTab = 'all';

        async function fetchData() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime());
                const data = await res.json();

                if (Array.isArray(data)) {
                    rawItemsList = data;
                } else if (data && typeof data === 'object') {
                    if (data.title) {
                        document.getElementById('mainTitle').textContent = data.title;
                        document.getElementById('pageTitle').textContent = data.title;
                    }
                    if (data.subtitle) {
                        document.getElementById('mainSubtitle').textContent = data.subtitle;
                    }
                    rawItemsList = Array.isArray(data.items) ? data.items : [];
                }

                updateStats();
                filterData();
            } catch (err) {
                document.getElementById('execTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ef4444;">Lỗi tải dữ liệu từ máy chủ!</td></tr>`;
            }
        }

        function updateStats() {
            const total = rawItemsList.length;
            const working = rawItemsList.filter(i => (i.status || '').toUpperCase() === 'WORKING').length;
            const error = total - working;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('workingCount').textContent = working;
            document.getElementById('errorCount').textContent = error;
        }

        function setTab(plat, btn) {
            currentTab = plat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterData();
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = rawItemsList.filter(item => {
                const matchPlat = currentTab === 'all' || (item.plat || '').toLowerCase() === currentTab.toLowerCase();
                const matchSearch = (item.name || '').toLowerCase().includes(query);
                return matchPlat && matchSearch;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('execTableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--text-sub);">Không tìm thấy dữ liệu phù hợp</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td class="exec-name">${item.name || '-'}</td>
                    <td>
                        <span class="plat-tag">
                            ${getPlatIcon(item.plat)} ${item.plat || '-'}
                        </span>
                    </td>
                    <td>${getStatusBadge(item.status)}</td>
                    <td class="price-text">${item.price || 'Free'}</td>
                    <td style="color: var(--text-sub);">${item.time || 'Cập nhật sau'}</td>
                    <td style="color: var(--text-sub);">${item.note || '-'}</td>
                </tr>
            `).join('');
        }

        function getPlatIcon(plat) {
            const p = (plat || '').toLowerCase();
            if (p === 'windows') return '<i class="fab fa-windows" style="color:#00a4ef;"></i>';
            if (p === 'android') return '<i class="fab fa-android" style="color:#3dda84;"></i>';
            if (p === 'ios') return '<i class="fab fa-apple" style="color:#a6b1b7;"></i>';
            if (p === 'mac') return '<i class="fas fa-desktop" style="color:#ffffff;"></i>';
            return '<i class="fas fa-microchip"></i>';
        }

        function getStatusBadge(status) {
            const s = (status || '').toUpperCase();
            if (s === 'WORKING') {
                return `<span class="status-badge status-working"><span class="dot"></span>WORKING</span>`;
            }
            if (s === 'UNSTABLE') {
                return `<span class="status-badge status-unstable"><span class="dot"></span>UNSTABLE</span>`;
            }
            if (s === 'PATCHED') {
                return `<span class="status-badge status-patched"><span class="dot"></span>PATCHED</span>`;
            }
            if (s === 'OUTDATED') {
                return `<span class="status-badge status-outdated"><span class="dot"></span>OUTDATED</span>`;
            }
            return `<span class="status-badge status-outdated"><span class="dot"></span>${s || 'UNKNOWN'}</span>`;
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
